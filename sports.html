<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCT - Spor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <img src="img/pp.webp" alt="Profile" class="profile-pic">
            </div>
            <div class="header-center">
                <h1>DCT App - Spor</h1>
            </div>
            <div class="header-right">
                <button class="bell-icon">🔔</button>
                <button class="theme-toggle-button" onclick="toggleTheme()">🌓</button>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Find Interesting news">
            <button id="search-button">Search</button>
        </div>

        <div class="category-bar">
            <span onclick="window.location.href='index.html'" style="color: #d1b9b2;">Ana Sayfa</span>
            <span onclick="window.location.href='tech.html'" style="color: #d1b9b2;">Teknoloji</span>
            <span onclick="window.location.href='game.html'" style="color: #d1b9b2;">Oyun</span>
            <span onclick="window.location.href='sports.html'" style="color: #d1b9b2;">Spor</span>
            <span onclick="window.location.href='agenda.html'" style="color: #d1b9b2;">Gündem</span>
        </div>

        <div class="news-section" id="trending-section">
            <h2>Trending</h2>
        </div>

        <div class="recommended-section" id="recommended-section">
            <h2>Recommended <a href="#" class="see-more">See More</a></h2>
        </div>
        
        <footer>
            <a href="index.html" class="footer-icon"><img src="img/home.webp" alt="Home"></a>
            <a href="search.html" class="footer-icon"><img src="img/search.webp" alt="Search"></a>
            <a href="#" class="footer-icon"><img src="img/saved.webp" alt="Saved"></a>
        </footer>
    </div>

    <script>
        fetch('posts.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(posts => {
                const trendingSection = document.getElementById('trending-section');
                const recommendedSection = document.getElementById('recommended-section');

                const filteredPosts = posts.filter(post => post.tags.includes('Spor'));

                if (filteredPosts.length > 0) {
                    const trendingPost = filteredPosts[0];
                    trendingSection.innerHTML += `
                        <div class="news-card" onclick="goToNews(${trendingPost.id})">
                            <img src="${trendingPost.image}" alt="${trendingPost.title}">
                            <div class="news-details">
                                <p>34 articles | 1720 reads</p>
                                <h3>${trendingPost.title}</h3>
                            </div>
                        </div>
                    `;

                    filteredPosts.slice(1).forEach(post => {
                        recommendedSection.innerHTML += `
                            <div class="recommendation-card" onclick="goToNews(${post.id})">
                                <img src="${post.image}" alt="${post.title}">
                                <div class="news-details">
                                    <p>${post.author} - Jun 12, 2024</p>
                                    <h3>${post.title}</h3>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    trendingSection.innerHTML += `<p>No trending posts available.</p>`;
                    recommendedSection.innerHTML += `<p>No recommended posts available.</p>`;
                }
            })
            .catch(error => {
                console.error('Error fetching posts:', error);
                const trendingSection = document.getElementById('trending-section');
                const recommendedSection = document.getElementById('recommended-section');
                trendingSection.innerHTML += `<p>Error loading posts. Check console for details.</p>`;
                recommendedSection.innerHTML += `<p>Error loading posts. Check console for details.</p>`;
            });

        // Function to navigate to news page
        function goToNews(postId) {
            window.location.href = `news.html?id=${postId}`;
        }

        // Function to toggle between light and dark themes
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-theme');
            const theme = body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
        }

        // Load the saved theme from localStorage
        window.onload = function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
        }

        // Function to handle search and redirect to results page
        function searchPosts() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if (!query) return; // Do nothing if input is empty

            fetch('posts.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(posts => {
                    const results = posts.filter(post => 
                        post.title.toLowerCase().includes(query) || 
                        post.content.toLowerCase().includes(query) || 
                        post.author.toLowerCase().includes(query)
                    );
                    if (results.length > 0) {
                        const params = new URLSearchParams();
                        params.append('query', query);
                        params.append('results', JSON.stringify(results));
                        window.location.href = `results.html?${params.toString()}`;
                    } else {
                        alert('No results found for "' + query + '".');
                    }
                })
                .catch(error => {
                    console.error('Error fetching posts:', error);
                    alert('Error loading posts. Check console for details.');
                });
        }

        // Add event listener to search button
        document.getElementById('search-button').addEventListener('click', searchPosts);

        // Handle Enter key press in search input
        document.getElementById('search-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchPosts();
            }
        });
    </script>
</body>
</html>
